<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="観測者不在の新しい記事や観測室の更新をメールで受け取るための登録ページです。">
  <title>観測者不在｜更新をメールで受け取る</title>
  <style>
    :root{
      --bg:#000000;
      --panel:#f3f1eb;
      --ink:#111214;
      --muted:#74706a;
      --line:rgba(255,255,255,.13);
      --white:#f7f7f5;
      --max:720px;
    }
    *{box-sizing:border-box}
    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--white);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP",sans-serif;
    }
    body{
      min-height:100vh;
      background:
        radial-gradient(circle at 50% 12%, rgba(255,255,255,.035), transparent 31rem),
        var(--bg);
    }
    main{
      width:min(calc(100% - 32px),var(--max));
      margin:0 auto;
      padding:44px 0 36px;
    }
    .brand{
      text-align:center;
      margin-bottom:30px;
    }
    .logo{
      width:116px;
      height:116px;
      object-fit:contain;
      display:block;
      margin:0 auto 20px;
      /* 元画像は黒背景＋暗い黒のロゴ。
         背景の黒は黒のまま、ロゴ部分のみ持ち上げる。 */
      filter:brightness(42) contrast(1.35);
      mix-blend-mode:screen;
      opacity:.9;
    }
    .eyebrow{
      margin:0 0 12px;
      font-size:11px;
      letter-spacing:.24em;
      color:rgba(255,255,255,.46);
      text-transform:uppercase;
    }
    h1{
      margin:0;
      font-size:clamp(34px,8vw,58px);
      font-weight:700;
      letter-spacing:.055em;
      line-height:1.15;
    }
    .lead{
      margin:18px auto 0;
      max-width:560px;
      font-size:15px;
      line-height:1.9;
      color:rgba(255,255,255,.68);
    }
    .panel{
      background:var(--panel);
      color:var(--ink);
      border-radius:22px;
      padding:26px 30px 22px;
      box-shadow:0 24px 60px rgba(0,0,0,.34),0 0 0 1px rgba(255,255,255,.035);
    }
    .panel-label{
      margin:0 0 8px;
      font-size:11px;
      letter-spacing:.18em;
      color:var(--muted);
    }
    .panel-title{
      margin:0 0 8px;
      font-size:22px;
      font-weight:650;
      letter-spacing:.02em;
    }
    .panel-copy{
      margin:0 0 24px;
      font-size:13px;
      line-height:1.8;
      color:#625f5a;
    }
    .benchmark-form{
      width:100%;
      min-height:92px;
      margin-top:-26px;
      margin-bottom:-12px;
      position:relative;
    }
    .privacy{
      margin:14px 0 0;
      font-size:11px;
      line-height:1.7;
      color:#85817a;
      position:relative;
      z-index:2;
    }
    .foot{
      margin-top:22px;
      padding-top:18px;
      border-top:1px solid var(--line);
      display:flex;
      justify-content:space-between;
      gap:18px;
      align-items:center;
      font-size:11px;
      color:rgba(255,255,255,.36);
    }
    @media (max-width:600px){
      main{
        width:min(calc(100% - 28px),var(--max));
        padding:24px 0 24px;
      }
      .brand{margin-bottom:24px}
      .logo{
        width:94px;
        height:94px;
        margin-bottom:16px;
      }
      .lead{
        margin-top:16px;
        font-size:14px;
        line-height:1.8;
      }
      .panel{
        border-radius:18px;
        padding:20px 16px 16px;
      }
      .panel-title{font-size:20px}
      .benchmark-form{
        margin-top:-42px;
        margin-bottom:-16px;
      }
      .foot{
        align-items:flex-start;
        flex-direction:column;
        gap:8px;
      }
    }
  </style>
</head>
